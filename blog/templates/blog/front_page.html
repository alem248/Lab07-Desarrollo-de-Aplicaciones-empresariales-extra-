<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Blog del laboratorio</title>
</head>
<body>
  <h1>Artículos publicados</h1>
  {% for post in posts %}
    <article>
      <h2>{{ post.title }}</h2>
      <p>Por {{ post.author.name }} · {{ post.published_at|date:"d/m/Y" }}</p>
      <p>
        {% for tag in post.tags.all %}<span>#{{ tag.name }}</span>{% empty %}<em>sin etiquetas</em>{% endfor %}
      </p>
    </article>
  {% empty %}
    <p>No hay artículos publicados.</p>
  {% endfor %}
</body>
</html>
